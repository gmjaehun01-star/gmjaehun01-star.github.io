<style>
:root{

  --ink:#0F1626; --char:#1A1F2E; --char-2:#242A3B;
  --text:#1E2430; --mute:#66708A; --line:#E1E6F5; --sky:#EEF2FF; --sky-2:#F6F8FF;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font-family:var(--f);font-size:17px;line-height:1.72;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;color:var(--ink);font-weight:800;letter-spacing:-.03em;line-height:1.18}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 28px}
.sec{padding:96px 0}
.sec--sky{background:var(--sky-2)}
.sec--char{background:var(--char);color:#fff}
.sec--char h2{color:#fff}
h2{font-size:clamp(28px,3.4vw,40px)}
.lead{color:var(--mute);margin-top:14px;max-width:58ch;font-size:17px;white-space:pre-line}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 태그·버튼 */
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sky);color:var(--blue);
  font-size:13px;font-weight:700;letter-spacing:.02em}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--blue);display:block}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:700;font-size:16px;
  text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn--grad{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(40,72,248,.28)}
.btn--grad:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(40,72,248,.36)}
.btn--white{background:#fff;color:var(--blue);border-color:#fff}
.btn--white:hover{background:var(--sky)}
.btn--line{border-color:var(--line);color:var(--ink);background:#fff}
.btn--line:hover{border-color:var(--blue);color:var(--blue)}
.btn--ghost{border-color:rgba(255,255,255,.45);color:#fff}
.btn--ghost:hover{background:rgba(255,255,255,.12)}

/* 언어 전환 */
.langbtn{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 12px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em;margin-left:14px}

.cap__txt{font-size:15px;color:#D5DBEE;background:var(--char-2);border-radius:10px 10px 10px 3px;padding:8px 12px}

/* 작동 원리 */

.how__step p{font-size:15px;color:var(--mute);margin-top:8px}
.how__arrow{color:var(--blue);font-size:26px;font-weight:300}
.how__langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.how__langs span{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue);background:var(--sky);border-radius:6px;padding:3px 7px}

/* 제품 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px}
.tile{text-decoration:none;display:flex;flex-direction:column;border-radius:var(--r);background:#fff;border:1px solid var(--line);overflow:hidden;

.tile__art img{max-height:100%;width:auto;max-width:100%;border-radius:8px 8px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.28);position:relative}
.tile__body{padding:22px 22px 24px}
.tile__body b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.tile__body em{font-style:normal;display:block;color:var(--blue);font-weight:700;font-size:14px;margin-top:2px}
.tile__body p{font-size:14.5px;color:var(--mute);margin-top:12px;line-height:1.6}
.tile__body u{display:inline-block;text-decoration:none;color:var(--blue);font-weight:700;font-size:14px;margin-top:14px}

/* 측정 결과 */
.proof{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;margin-top:44px}

.pbar{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;margin-bottom:16px}

.figs-note{font-size:13.5px;color:#9AA3BC;margin-top:22px;line-height:1.7}

.tk{flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;

.trial{background:var(--grad);color:#fff;border-radius:24px 24px 24px 8px;padding:56px 56px 52px;position:relative;overflow:hidden}
.trial::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08)}
.trial h2{color:#fff;font-size:clamp(28px,3.4vw,40px)}
.trial .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px;position:relative}
.trial .col{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px 16px 16px 5px;padding:24px 24px 26px}
.trial .col b{display:block;font-size:18px;margin-bottom:8px}
.trial .col p{font-size:15px;color:#E4EBFF;margin-bottom:18px}

/* 바닥 */
footer{background:var(--ink);color:#9AA3BC;padding:52px 0 48px;font-size:14px}
.fgrid{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;align-items:flex-start}
footer .flogo{height:22px;width:auto;margin-bottom:16px}
footer b{color:#fff}
.fnav{display:flex;gap:18px;flex-wrap:wrap}
.fnav a{text-decoration:none;color:#9AA3BC}
.fnav a:hover{color:#fff}

/* 제품 상세 */
.phead{background:linear-gradient(180deg,#fff,var(--sky-2));padding:68px 0 60px;border-bottom:1px solid var(--line)}
.phead h1{font-size:clamp(36px,5vw,60px);margin-top:20px}
.phead h1 span{display:block;font-size:clamp(18px,2.2vw,26px);font-weight:700;color:var(--blue);margin-top:8px;letter-spacing:-.02em}
.phead .lead{margin-top:20px;font-size:18px}
.phead .where{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px}
.phead .where span{font-size:13px;color:var(--mute);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
.video{background:var(--char);aspect-ratio:16/9;position:relative;border-radius:var(--r) var(--r) var(--r) 6px;overflow:hidden;
  box-shadow:0 30px 60px rgba(15,22,38,.2);margin-top:-40px}
.video iframe{width:100%;height:100%;border:0;display:block}
.video__ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#9AA3BC}
.video__ph b{color:#fff;font-size:20px;display:block;margin-bottom:6px}
.video__ph span{font-size:14px}
.play{position:absolute;inset:0;border:0;background:rgba(15,22,38,.3);cursor:pointer;display:grid;place-items:center;padding:0}
.play:hover{background:rgba(15,22,38,.15)}
.play i{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 30px rgba(40,72,248,.4)}
.play i::before{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:44px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.feat i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:13px}
.feat b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.02em}
.feat p{font-size:15px;color:var(--mute);margin-top:6px;line-height:1.6}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:40px}
.shot{margin:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 16px;display:flex;flex-direction:column}
.shot .im{flex:1;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:420px}
.shot img{max-height:400px;width:auto;border-radius:8px}
.shot figcaption{font-size:13.5px;color:var(--mute);margin-top:14px;display:flex;gap:10px;align-items:center}
.shot figcaption i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--sky);border-radius:6px;padding:2px 7px;font-weight:700}
.shot--wide{grid-column:1/-1}
.shot--hero{margin:-40px 0 0;padding:0;border-radius:var(--r) var(--r) var(--r) 6px;overflow:hidden;
  box-shadow:0 26px 54px rgba(15,22,38,.14);background:#fff}
.shot--hero .im{min-height:0;max-height:none}
.shot--hero img{width:100%;max-height:none;border-radius:0}
@media (max-width:960px){.shot--hero{margin-top:0}}


/* 기관 유형별 */
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.seg{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 6px;padding:28px 26px;
  transition:transform .2s,box-shadow .2s,border-color .2s}
.seg:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(40,72,248,.14);border-color:transparent}
.seg b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.seg p{font-size:14.5px;color:var(--mute);margin-top:10px;white-space:pre-line;line-height:1.6}
.seg u{display:inline-block;text-decoration:none;color:var(--blue);font-weight:700;font-size:14px;margin-top:16px}
.issues{display:grid;gap:14px;margin-top:40px}
.issue{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:24px 26px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.issue i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:14px}
.issue b{display:block;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.issue p{font-size:15px;color:var(--mute);margin-top:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}

/* FAQ */
.faq{margin-top:36px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:22px 0;font-size:17px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-weight:400;font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .a{padding:0 0 24px;color:var(--mute);font-size:15.5px;max-width:70ch}

/* 문의 */
.contact{display:grid;grid-template-columns:320px 1fr;gap:40px;margin-top:40px}
.contact .info{font-size:15px;color:var(--mute)}
.contact .info b{display:block;color:var(--ink);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 6px}
.contact .info b:first-child{margin-top:0}
.contact .info a{color:var(--ink);text-decoration:none;font-weight:600}
.contact .info a:hover{color:var(--blue)}
.contact .form{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:720px}
.contact .form iframe{width:100%;height:100%;min-height:720px;border:0;display:block}
.contact .form .ph{padding:40px;text-align:center;color:var(--mute)}

/* 메인 소개 영상 */
.intro{background:var(--char);color:#fff}
.intro h2{color:#fff}
.intro .lead{color:#9AA3BC}
.iv{margin-top:36px;border-radius:var(--r) var(--r) var(--r) 6px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative;
  border:1px solid #2C3348}
.iv iframe{width:100%;height:100%;border:0;display:block}
.iv img{width:100%;height:100%;object-fit:cover}
.iv .play{position:absolute;inset:0;border:0;background:rgba(15,22,38,.34);cursor:pointer;display:grid;place-items:center;padding:0}
.iv .play:hover{background:rgba(15,22,38,.16)}
.iv .play i{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 34px rgba(40,72,248,.45)}
.iv .play i::before{content:"";border-left:24px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:7px}
.ivnav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.ivnav button{flex:1;min-width:150px;text-align:left;background:var(--char-2);border:1px solid #2C3348;border-radius:12px 12px 12px 4px;
  padding:14px 18px;color:#C3CBE0;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s}
.ivnav button:hover{border-color:var(--blue-x);color:#fff}
.ivnav button.on{background:var(--grad);border-color:transparent;color:#fff}
.ivnav button span{display:block;font-size:11.5px;font-weight:700;opacity:.7;margin-bottom:3px;letter-spacing:.06em}

/* 제품 비교표 */
.cmp{margin-top:36px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.cmp table{width:100%;min-width:760px;border-collapse:collapse;font-size:14.5px}
.cmp th,.cmp td{padding:15px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{background:var(--sky);color:var(--ink);font-weight:800;font-size:15px;letter-spacing:-.02em;border-bottom:2px solid var(--blue)}
.cmp thead th a{text-decoration:none}
.cmp thead th small{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-top:3px}
.cmp tbody th{background:var(--sky-2);color:var(--ink);font-weight:700;white-space:nowrap;width:150px}
.cmp td{color:var(--mute)}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.cmp-note{font-size:13px;color:var(--mute);margin-top:12px}

/* 다른 제품 보기 */
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.more a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:20px 22px;
  transition:border-color .15s,transform .15s}
.more a:hover{border-color:var(--blue);transform:translateY(-2px)}
.more a b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.02em}
.more a em{font-style:normal;display:block;font-size:13.5px;color:var(--blue);margin-top:3px}
.more a span{display:block;font-size:13.5px;color:var(--mute);margin-top:10px;line-height:1.55}

/* 404 */
.nf{min-height:62vh;display:grid;place-content:center;text-align:center;padding:80px 0}
.nf b{display:block;font-size:clamp(60px,10vw,110px);font-weight:800;letter-spacing:-.05em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.nf h1{font-size:clamp(24px,3.2vw,34px);margin-top:18px}
.nf p{color:var(--mute);margin-top:14px}
.nf .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}

/* 선택표 */
.choose{margin-top:36px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.choose a{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:20px 24px;text-decoration:none;border-top:1px solid var(--line)}
.choose a:first-child{border-top:0}
.choose a:hover{background:var(--sky-2)}
.choose a span{font-size:16px;color:var(--text)}
.choose a b{font-size:15px;color:var(--blue);white-space:nowrap}
.choose a b small{display:block;font-weight:600;color:var(--mute);font-size:12px;text-align:right}

/* 사용 흐름 */
.flow{display:grid;gap:12px;margin-top:28px}
.flow div{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:18px 20px;background:var(--sky-2);border-radius:14px 14px 14px 4px}
.flow i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:13px;margin-top:2px}
.flow b{display:block;font-size:16px;color:var(--ink)}
.flow p{font-size:14.5px;color:var(--mute);margin-top:4px}
.scenes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.scenes span{font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.h3{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:52px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.pair a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:20px 22px}
.pair a:hover{border-color:var(--blue)}
.pair a b{display:block;color:var(--ink);font-size:16px}
.pair a span{display:block;color:var(--mute);font-size:14px;margin-top:4px}

/* 도입 절차 */
.proc{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:36px}
.proc div{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:20px 18px;position:relative}
.proc i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:13px}
.proc b{display:block;font-size:15.5px;color:var(--ink);margin-top:14px}
.proc p{font-size:13.5px;color:var(--mute);margin-top:6px;line-height:1.55}

/* 회사 소개 */
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.about div{background:#fff;border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 6px;padding:26px}
.about b{display:block;font-size:13px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.about strong{display:block;font-size:20px;color:var(--ink);margin-top:6px;letter-spacing:-.02em}
.about p{font-size:15px;color:var(--mute);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.facts div{background:var(--sky-2);border-radius:14px 14px 14px 4px;padding:18px 20px}
.facts span{display:block;font-size:13px;color:var(--mute)}
.facts b{display:block;font-size:17px;color:var(--ink);margin-top:4px;font-weight:800;letter-spacing:-.01em}

/* 접근성 · 인쇄 */
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{left:16px}
:focus-visible{outline:3px solid var(--blue-x);outline-offset:3px}
@media print{
  header,.stick,.cap,.ticker,.video,.btn,.lnk,footer .fnav{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .sec{padding:18pt 0}
  .sec--char,.sec--char h2{background:#fff!important;color:#000!important}
  .fig b{color:#000!important;-webkit-text-fill-color:#000}
  .tile__art{display:none}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9pt;color:#555}
}

/* 모바일 고정 CTA */
.stick{display:none}

@media (max-width:960px){
  .segs,.pick,.contact,.pair,.about,.more{grid-template-columns:1fr}
  .proc{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr 1fr}
  .stick{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .stick .btn{flex:1;justify-content:center;padding:13px 10px;font-size:15px}
  body{padding-bottom:74px}
  .hero .grid{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .how__arrow{transform:rotate(90deg);text-align:center}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .proof{grid-template-columns:1fr}
  .pbar{grid-template-columns:1fr auto;gap:6px 12px}
  .pbar__n{grid-column:1/-1}
  .pcard{padding:24px 22px}
  .trial{padding:36px 26px}
  .trial .cols,.feats,.sgrid{grid-template-columns:1fr}
  .bar{height:auto;flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .brand img{height:24px}
  .langbtn{margin-left:auto;padding:6px 10px}
  .btn--sm{margin-left:0}
  nav{order:3;width:100%;margin-left:0;gap:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none}
  nav a i{display:none}
  .sec{padding:64px 0}
  .video{margin-top:0}
}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}

/* 언어 결정: ?lang= → 이전 선택 → 브라우저 언어 */
function detectLang(){
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='en'||q==='ko') return q;
  try{ const v=localStorage.getItem('tkita_lang'); if(v==='en'||v==='ko') return v; }catch(e){}
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||'ko').toLowerCase();
  return n.startsWith('ko') ? 'ko' : 'en';
}

/* 영문 설정(SITE_EN)을 한국어 설정 위에 덮어써 영문판을 만듭니다 */
function buildSite(lang){
  if(lang!=='en' || typeof SITE_EN==='undefined') return SITE;
  const o=JSON.parse(JSON.stringify(SITE));
  const deep=(a,b)=>{ for(const k in b){ const v=b[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deep(a[k],v); else a[k]=v; } };
  const {products, segments, ...rest}=SITE_EN;
  deep(o,rest);
  if(products) o.products.forEach(p=>{ const x=products[p.id]; if(!x) return;
    const {shotCaps, ...r}=x; Object.assign(p,r);
    if(shotCaps) p.shots=p.shots.map((sh,i)=>[sh[0], shotCaps[i]||sh[1]]); });
  if(segments) o.segments.forEach(g=>{ if(segments[g.id]) Object.assign(g,segments[g.id]); });
  return o;
}

/* 자막 패널 데모 */
let demoTimer = [];
function stopDemo(){ demoTimer.forEach(t=>{clearTimeout(t);clearInterval(t);}); demoTimer = []; }
function runDemo(){
  const ko = $('#demoKo'), tr = $('#demoTr'), tc = $('#demoTc');
  if(!ko) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sec = 0; const clock=()=>{ sec++; if(tc) tc.textContent=`${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec/60)%60)}:${pad(sec%60)}`; };
  demoTimer.push(setInterval(clock,1000));
  let i = 0;
  const step = () => {
    const item = S.heroDemo[i % S.heroDemo.length];
    const code = l => ({'English':'EN','Tiếng Việt':'VI','中文':'ZH','日本語':'JA','Русский':'RU'}[l] || l.slice(0,2).toUpperCase());
    tr.innerHTML = item.tr.map(([l,t])=>`<div class="cap__row"><span class="cap__lang">${esc(code(l))}</span><span class="cap__txt">${esc(t)}</span></div>`).join('');
    const rows = tr.querySelectorAll('.cap__row');
    if(reduce){ ko.textContent=item.ko; rows.forEach(r=>r.classList.add('show')); demoTimer.push(setTimeout(()=>{i++;step();},5200)); return; }
    ko.innerHTML = '<span class="caret"></span>';
    let c = 0;
    const type = () => { c++; ko.innerHTML = esc(item.ko.slice(0,c)) + '<span class="caret"></span>';
      if(c < item.ko.length) demoTimer.push(setTimeout(type, 50));
      else rows.forEach((r,k)=>demoTimer.push(setTimeout(()=>r.classList.add('show'), 360 + k*240))); };
    demoTimer.push(setTimeout(type, 450));
    demoTimer.push(setTimeout(()=>{ i++; step(); }, 450 + item.ko.length*50 + 3800));
  };
  step();
}

/* 막대가 화면에 들어오면 길이를 채웁니다 */
function initBars(){
  const tracks=[...document.querySelectorAll('.pbar__t')].filter(t=>t.querySelector('.pbar__f[data-w]'));
  if(!tracks.length) return;
  const fill=t=>{ const f=t.querySelector('.pbar__f[data-w]'); if(!f) return; f.style.width=f.dataset.w+'%'; f.removeAttribute('data-w'); };
  if(!('IntersectionObserver' in window)){ tracks.forEach(fill); return; }
  const io=new IntersectionObserver((es,ob)=>es.forEach(e=>{ if(e.isIntersecting){ fill(e.target); ob.unobserve(e.target); } }),{threshold:.3});
  tracks.forEach(t=>io.observe(t));
}

/* 레퍼런스 구간이 화면에 들어올 때 로고를 불러옵니다 */
function initTicker(){
  const rows=document.querySelectorAll('.ticker'); if(!rows.length) return;
  const load = el => el.querySelectorAll('img[data-src]').forEach(i=>{ i.src=i.dataset.src; i.removeAttribute('data-src'); });
  if(!('IntersectionObserver' in window)){ rows.forEach(load); return; }
  const io=new IntersectionObserver((es,ob)=>es.forEach(e=>{ if(e.isIntersecting){ load(e.target); ob.unobserve(e.target); } }),{rootMargin:'300px'});
  rows.forEach(r=>io.observe(r));
}
function tickerHTML(){
  const n=S.refs.length, half=Math.ceil(n/2);
  const a=S.refs.slice(0,half), b=S.refs.slice(half);

    `<p class="refnote">${T("refnote",{n})}</p>`;
}
function tk(r){

        onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(v[0][0])}/hqdefault.jpg'">
      <button class="play" aria-label="${T('play')}" onclick="playIntro(0)"><i></i></button>
    </div>
    <div class="ivnav" id="ivnav">${v.map(([id,tt],i)=>
      `<button onclick="playIntro(${i})" data-i="${i}"><span>${pad(i+1)}</span>${esc(tt||T('video_n',{n:i+1}))}</button>`).join('')}</div>
  </div></section>`;
}

/* 소개 영상 — 순서대로 이어 재생 */
let ivPlayer=null, ivIdx=0, ivApi=false;
function ivList(){ return (S.intro&&S.intro.videos?S.intro.videos:[]).filter(x=>x&&x[0]); }
function ivMark(i){ document.querySelectorAll('#ivnav button').forEach(b=>b.classList.toggle('on', +b.dataset.i===i)); }
window.playIntro = function(i){
  const list = ivList(); if(!list.length) return;
  ivIdx = i; ivMark(i);
  if(window.gtag) gtag('event','intro_video',{label:list[i][1]||list[i][0], index:i+1});
  if(ivPlayer && ivPlayer.loadVideoById){ ivPlayer.loadVideoById(list[i][0]); return; }
  const box = document.getElementById('iv'); if(!box) return;
  box.innerHTML = '<div id="ivFrame"></div>';
  const make = () => {
    ivPlayer = new YT.Player('ivFrame', {
      videoId: list[ivIdx][0], playerVars:{autoplay:1, rel:0, playsinline:1},
      events:{ onStateChange: e => { if(e.data === YT.PlayerState.ENDED){
        const n = (ivIdx+1) % ivList().length; ivIdx = n; ivMark(n);
        ivPlayer.loadVideoById(ivList()[n][0]); } } }
    });
  };
  if(window.YT && window.YT.Player){ make(); return; }
  window.onYouTubeIframeAPIReady = make;
  if(!ivApi){ ivApi=true; const t=document.createElement('script');
    t.src='https://www.youtube.com/iframe_api'; document.head.appendChild(t); }
};

function compareHTML(){
  const c=S.compare; if(!c||!c.rows||!c.rows.length) return '';
  const ps=S.products;
  return `<section class="sec"><div class="wrap">
    <h2>${esc(c.title||'')}</h2>
    <p class="lead">${esc(c.lead||'')}</p>
    <div class="cmp"><table>
      <thead><tr><th>${T("cmp_col")}</th>${ps.map(p=>
        `<th><a href="#/${p.id}">${esc(p.name)}<small>${esc(p.short)}</small></a></th>`).join('')}</tr></thead>
      <tbody>${c.rows.map(r=>
        `<tr><th>${esc(r[0])}</th>${r.slice(1).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="cmp-note">${T("cmp_note")}</p>
  </div></section>`;
}

function moreHTML(cur){
  const rest=S.products.filter(p=>p.id!==cur);
  if(!rest.length) return '';
  return `<section class="sec sec--sky"><div class="wrap">
    <h2>${T("more_h")}</h2>
    <p class="lead">${T("more_lead")}</p>
    <div class="more">${rest.map(p=>
      `<a href="#/${p.id}"><b>${esc(p.name)}</b><em>${esc(p.short)}</em><span>${esc(p.lead)}</span></a>`).join('')}</div>
  </div></section>`;
}

function notFound(){
  return `<section class="sec"><div class="wrap nf">
    <b>404</b>
    <h1>${T("nf_h")}</h1>
    <p>${T("nf_p")}</p>
    <div class="cta">
      <a class="btn btn--grad" href="#/">${T("nf_home")}</a>
      <a class="btn btn--line" href="#/contact">${T("cta_long")}</a>
    </div>
  </div></section>`;
}

function procHTML(){
  return `<section class="sec sec--sky"><div class="wrap">
    <h2>${T("proc_h")}</h2>
    <p class="lead">${T("proc_lead")}</p>
    <div class="proc">${S.procedure.map(([t,d],i)=>`<div><i>${i+1}</i><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div>
  </div></section>`;
}
function aboutPage(){
  const a=S.about;
  return `
  <section class="phead"><div class="wrap">
    <span class="tag"><i></i>${T("about_tag")}</span>
    <h1>${T("about_h")}</h1>
    <p class="lead">${esc(a.lead)}</p>
  </div></section>
  <section class="sec"><div class="wrap">
    <div class="about">
      <div><b>${T("maker")}</b><strong>${esc(S.maker)}</strong><p>${esc(a.maker)}</p></div>
      <div><b>${T("seller")}</b><strong>${esc(S.seller)}</strong><p>${esc(a.seller)}</p><p style="margin-top:8px">${esc(S.addr)}<br>Tel. ${esc(telShown())} · ${esc(S.email)}</p></div>
    </div>
    <div class="facts">${a.facts.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${S.certUrl?`<p class="lead" style="margin-top:18px;font-size:14px"><a href="${esc(S.certUrl)}" target="_blank" rel="noopener" data-ev="cert_view" style="color:var(--blue)">${T("cert_full")}</a></p>`:''}
  </div></section>
  ${procHTML()}
  ${trialHTML()}`;
}
function faqHTML(){
  if(!S.faq || !S.faq.show) return '';
  return `<section class="sec"><div class="wrap">
    <h2>${T("faq_h")}</h2>
    <div class="faq">${S.faq.items.map(([q,a])=>`<details><summary>${esc(q)}</summary><div class="a">${esc(a)}</div></details>`).join('')}</div>
  </div></section>`;
}

function segment(g){
  const prods = g.products.map(id=>S.products.find(p=>p.id===id)).filter(Boolean);
  return `
  <section class="phead"><div class="wrap">
    <span class="tag"><i></i>${T("seg_tag",{name:esc(g.name)})}</span>
    <h1 style="white-space:pre-line">${esc(g.headline)}</h1>
    <p class="lead">${T("seg_intro",{name:esc(g.name)})}</p>
  </div></section>
  <section class="sec"><div class="wrap">
    <h2>${T("seg_issue_h")}</h2>
    <div class="issues">${g.issues.map(([t,d],i)=>`<div class="issue"><i>${i+1}</i><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}</div>
  </div></section>
  <section class="sec sec--sky"><div class="wrap">
    <h2>${T("seg_pick_h",{name:esc(g.name)})}</h2>
    <p class="lead">${T("seg_pick_lead",{name:esc(g.name)})}</p>
    <div class="pick">${prods.map(p=>`
      <a class="tile" href="#/${p.id}">
        <div class="tile__art"><img src="${esc(p.shots[0][0])}" alt="${esc(p.name)}" loading="lazy"></div>
        <div class="tile__body"><b>${esc(p.name)}</b><em>${esc(p.short)}</em><p>${esc(p.lead)}</p><u>${T("more_link")}</u></div>
      </a>`).join('')}</div>
    <p class="lead" style="margin-top:28px;font-size:14px">${T("seg_depts")} · ${esc(g.depts)}</p>
  </div></section>
  <section class="sec sec--char"><div class="wrap">
    <h2>${T("proof_h")}</h2>
    ${figsHTML()}
  </div></section>
  ${trialHTML()}`;
}

function contact(){
  const form = S.formEmbed
    ? `<iframe src="${esc(S.formEmbed)}" title="${T('contact_tag')}" allowfullscreen></iframe>`
    : `<div class="ph" style="display:grid;place-content:center;min-height:420px;gap:14px">
         <p style="font-size:18px;font-weight:700;color:var(--ink)">${T("form_h")}</p>
         <p>${T("form_p")}</p>
         ${T("form_note",{email:esc(S.email)})?`<p style="font-size:13.5px">${T("form_note",{email:esc(S.email)})}</p>`:""}
         <p style="margin-top:8px"><a class="btn btn--grad" href="${esc(S.applyUrl)}" target="_blank" rel="noopener" data-ev="cta_apply">${T("form_open")}</a></p>
         ${S.privacyUrl?`<p style="font-size:13px"><a href="${esc(S.privacyUrl)}" target="_blank" rel="noopener" style="color:var(--mute)">${T("privacy")}</a></p>`:''}
       </div>`;
  return `
  <section class="phead"><div class="wrap">
    <span class="tag"><i></i>${T("contact_tag")}</span>
    <h1>${T("contact_h")}</h1>
    <p class="lead">${T("contact_lead")}</p>
  </div></section>
  <section class="sec"><div class="wrap contact">
    <div class="info">
      <b>${T("i_tel")}</b><a href="tel:${esc(S.tel.replace(/-/g,''))}" data-ev="contact_tel">${esc(telShown())}</a>
      <b>${T("i_mail")}</b><a href="mailto:${esc(S.email)}" data-ev="contact_mail">${esc(S.email)}</a>
      <b>${T("i_fax")}</b>${esc(LANG==="en"?intl(S.fax):S.fax)}
      <b>${T("i_addr")}</b>${esc(S.addr)}
      <b>${T("i_org")}</b>${esc(S.maker)}<br>${esc(S.seller)}
    </div>
    <div class="form">${form}</div>
  </div></section>
  ${procHTML()}`;
}

function product(p, n){
  const hero = !p.youtube && p.shots.length ? p.shots[0] : null;
  const vid = p.youtube
    ? `<div class="video" data-yt="${esc(p.youtube)}"><img src="https://i.ytimg.com/vi/${esc(p.youtube)}/maxresdefault.jpg" alt="${esc(p.name)} ${T('intro_default')}"
         onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(p.youtube)}/hqdefault.jpg'">
       <button class="play" aria-label="${esc(p.name)} ${T('play')}"><i></i></button></div>`
    : `<figure class="shot shot--hero"><div class="im"><img src="${esc(hero[0])}" alt="${esc(hero[1])}"></div></figure>`;
  const list = hero ? p.shots.slice(1) : p.shots;
  const shots = list.map(([src,cap],i)=>{
    const wide = /talk-hw|caption-phones|mobile-invite|meet-app/.test(src);
    return `<figure class="shot${wide?' shot--wide':''}"><div class="im"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"></div>
      <figcaption><i>${pad(i+1)}</i>${esc(cap)}</figcaption></figure>`; }).join('');
  return `
  <section class="phead"><div class="wrap">
    <span class="tag"><i></i>${T("p_tag",{n:pad(n),tag:esc(p.tag)})}</span>
    <h1>${esc(p.name)}<span>${esc(p.short)}</span></h1>
    <p class="lead">${esc(p.lead)}</p>
    <div class="where">${p.where.split('·').map(w=>`<span>${esc(w.trim())}</span>`).join('')}</div>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="wrap">
    ${vid}
    <div class="feats">${p.feats.map(([t,d],i)=>`<div class="feat"><i>${pad(i+1)}</i><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}</div>

    <div class="h3">${T("p_flow")}</div>
    <div class="flow">${(p.flow||[]).map(([t,d],i)=>`<div><i>${i+1}</i><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}</div>

    <div class="h3">${T("p_scenes")}</div>
    <div class="scenes">${(p.scenes||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>

    <div class="h3">${T("p_pair")}</div>
    <div class="pair">${S.segments.filter(g=>g.products.includes(p.id)).map(g=>{
      const other=g.products.filter(x=>x!==p.id).map(x=>S.products.find(q=>q.id===x)).filter(Boolean).map(q=>q.name).join(', ');
      return `<a href="#/${g.id}"><b>${esc(g.name)}</b><span>${T("p_pair_link",{a:esc(p.name),b:esc(other)})}</span></a>`;}).join('')}</div>
  </div></section>

  <section class="sec sec--sky" style="padding-top:72px"><div class="wrap">
    <h2>${T("p_shots")}</h2>
    <div class="sgrid">${shots}</div>
  </div></section>

  <section class="sec sec--char"><div class="wrap">
    <h2>${T("p_proof")}</h2>
    ${figsHTML()}
  </div></section>

  ${moreHTML(p.id)}
  ${trialHTML()}`;
}

function route(){
  stopDemo();
  ivPlayer=null; ivIdx=0;
  const id = (location.hash.replace('#/','') || 'home').trim();
  const idx = S.products.findIndex(x=>x.id===id);
  const p = S.products[idx];
  const g = S.segments.find(x=>x.id===id);
  let html, title;
  if(p){ html = product(p, idx+1); title = `${p.name} ${p.short} — ${p.tag} | Tkita`; }
  else if(g){ html = segment(g); title = T('title_seg',{name:g.name}); }
  else if(id==='contact'){ html = contact(); title = T('title_contact'); }
  else if(id==='about'){ html = aboutPage(); title = T('title_about'); }
  else if(id==='faq' && S.faq && S.faq.show){ html = faqHTML() + trialHTML(); title = T('title_faq'); }
  else if(id==='home' || id===''){ html = home(); title = T('title_home'); }
  else { html = notFound(); title = T('title_nf'); }
  $('#app').innerHTML = html;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.id===(p?id:(g||id==='contact'||id==='faq'||id==='about')?'':'home')));
  document.title = title;
  window.scrollTo(0,0);
  if(window.gtag) gtag('event','page_view',{page_title:title,page_location:S.siteUrl+(location.hash||''),page_path:'/'+(id==='home'?'':id)});
  if(!p && !g && !['contact','faq','about'].includes(id) && (id==='home'||id==='')) runDemo();
  initTicker();
  initBars();
  const v = $('.video[data-yt]');
  if(v) v.querySelector('.play').addEventListener('click',()=>{
    v.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?autoplay=1&rel=0" title="${T('intro_default')}"
      allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
  });
}
window.addEventListener('hashchange', route);
chrome();
route();
</script>
